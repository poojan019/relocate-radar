[project]
name = "relocate-radar"
version = "0.0.0"
description = "Search engine for English-speaking tech jobs in Germany (workspace root)"
requires-python = ">=3.12,<3.13"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/hybrid-search", "apps/api", "apps/crawler"]

[tool.uv.sources]
hybrid-search = { workspace = true }
relocate-api = { workspace = true }
relocate-crawler = { workspace = true }

[dependency-groups]
dev = [
    "hybrid-search",
    "relocate-api",
    "relocate-crawler",
    "httpx>=0.27",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["apps/web"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "N", "PT"]

[tool.pytest.ini_options]
addopts = "-ra --import-mode=importlib"
testpaths = ["packages/hybrid-search/tests", "apps/api/tests", "apps/crawler/tests"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.ruff.lint.isort]
known-first-party = ["hybrid_search", "relocate_api", "relocate_crawler"]
