[project]
name = "relocate-crawler"
version = "0.0.1"
description = "RelocateRadar job-posting crawler (Scrapy)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "scrapy>=2.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/relocate_crawler"]
