[project]
name = "relocate-api"
version = "0.0.1"
description = "RelocateRadar HTTP API (FastAPI)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "hybrid-search",
]

[tool.uv.sources]
hybrid-search = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/relocate_api"]
